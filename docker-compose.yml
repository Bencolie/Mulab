services:
  mulab:
    build: .
    container_name: mulab_app
    ports:
      - "4000:4000"
    volumes:
      # mount SQLite database and downloaded music files to host, 
      # avoiding data loss on container recreation
      - ./website/instance:/app/instance
      - ./website/static/downloads:/app/website/static/downloads
    restart: unless-stopped